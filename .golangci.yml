version: "2"
run:
  build-tags:
    - gocv

linters:
  enable:
    - gocritic
    - misspell
    - prealloc
    - revive
  settings:
    revive:
      # Only the doc-comment rule: every exported identifier needs a comment that
      # starts with its name (BUGS.md DOC-001). The stutter check is off because
      # names like camera.CameraConfig already exist.
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

linters-settings:
  gocritic:
    enabled-checks:
      - diagnostic
      - performance
      - style
      - complexity
      - experimental
      - module
  misspell:
    locale: US
  prealloc:
    simple: true
    range-loops: true
    for-loops: true
