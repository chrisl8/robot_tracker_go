version: "2"
run:
  build-tags:
    - gocv

linters:
  enable:
    - gocritic
    - misspell
    - prealloc

linters-settings:
  gocritic:
    enabled-checks:
      - diagnostic
      - performance
      - style
      - complexity
      - experimental
      - module
  misspell:
    locale: US
  prealloc:
    simple: true
    range-loops: true
    for-loops: true
