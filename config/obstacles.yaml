# Static Obstacles Configuration
# These are rectangular obstacles defined in pixel coordinates
# and their corresponding world coordinates (in meters)
#
# Format:
# - name: unique_name
#   pixels_top_left: [x, y]
#   pixels_bottom_right: [x, y]
#   world_top_left: [x_m, y_m]
#   world_bottom_right: [x_m, y_m]
#   clearance: 0.02  # Safety margin in meters

obstacles:
  - name: obstacle_1
    pixels_top_left: [100, 100]
    pixels_bottom_right: [200, 250]
    world_top_left: [1.0, 1.0]
    world_bottom_right: [2.0, 2.5]
    clearance: 0.02

  - name: obstacle_2
    pixels_top_left: [400, 300]
    pixels_bottom_right: [500, 400]
    world_top_left: [4.0, 3.0]
    world_bottom_right: [5.0, 4.0]
    clearance: 0.02
