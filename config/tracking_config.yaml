# Robot Tracking System Configuration

# Camera Settings
cameras:
  # Camera 0 - Primary (e.g., Logitech or other USB camera or DroidCam over HTTP)
  # - id: 0
  #   name: "primary_camera"
  #   width: 1280
  #   height: 720
  #   fps: 30
  #   autofocus: true
  #   exposure: -1 # Auto

  # IP Camera Example

  # - type: "ip"
  #   name: "ip_camera"
  #   url: "http://192.168.8.88:4747/video"
  #   width: 1280
  #   height: 720
  #   fps: 30
  #   username: null  # optional, for HTTP auth
  #   password: null  # optional, for HTTP auth

  - camera_id: 0
    name: "usb_camera"
    width: 1280
    height: 720
    fps: 30

  # - type: "ip"
  #   name: "ip_camera"
  #   url: "http://192.168.8.183:4747/video"
  #   fps: 30

  # Camera 1 - Secondary (optional, for multi-camera setup)
  # - id: 1
  #   name: "secondary_camera"
  #   width: 1280
  #   height: 720
  #   fps: 30

# AprilTag Settings
april_tags:
  family: "tag36h11" # 587 unique IDs
  quad_decimate: 1.0 # No downsampling; preserves full resolution for distant/angled tags
  quad_sigma: 0.0 # Blur before decoding
  refine_edges: 1
  decode_sharpening: 0.25
  min_tag_size: 0.02 # Minimum tag size relative to image dimension
  max_hamming_distance: 2

# Temporary-obstacle detection (background subtraction). Finds anything in the
# arena that is not the empty floor, a robot, or a marked static obstacle. Costs
# ~1.5 ms per frame and needs no model. Objects stay obstacles until they are
# removed (see absorb_after_sec) or you press "Reset background"/"Absorb" in the UI.
foreground:
  enabled: true
  apply_to_planner: false # false = "shadow mode": detect and show obstacles in the UI
                          # but do not steer around them. Set true (or use the UI
                          # toggle) once the detections look right.
  scale: 0.5              # working resolution relative to the camera frame
  threshold: 22           # gray-level change (0-255) that counts as an object
  dark_factor: 1.4        # darkening must change dark_factor x threshold (shadows)
  min_size_m: 0.05        # ignore anything smaller than this on the floor
  appear_ms: 400          # must persist this long before it becomes an obstacle
  vanish_ms: 1500         # stays an obstacle this long after it disappears
  tau_sec: 60             # background learning time constant (lighting drift)
  warmup_sec: 3           # seconds of clear floor to learn from at start
  robot_margin_m: 0.06    # extra masked margin around each robot
  static_margin_px: 6     # extra masked margin around marked static obstacles
  max_blobs: 8            # at most this many temporary obstacles
  pad_m: 0.02             # padding added to each obstacle for the planner
  guard_fraction: 0.25    # if more than this share of the frame changes at once,
                          # treat it as a lighting event and hold the last obstacles
  absorb_after_sec: 0     # 0 = a stationary object stays an obstacle until removed
  persist_background: true    # save the learned background to disk and restore it on
                               # the next start, so a restart resumes instantly instead
                               # of re-learning (and any object in view isn't briefly
                               # absorbed into the new "empty floor" baseline)
  persist_interval_sec: 30    # how often the background is saved while warm
  shadow_alpha_min: 0.15       # a darkened pixel colour-matching the background
  shadow_alpha_max: 0.98       # scaled by a factor in this range is a cast shadow,
                                # not an object (e.g. a robot's shadow on the floor),
                                # and stays classified as background
  shadow_chroma_max: 0.20      # how much colour drift (beyond just darker) is still
                                # allowed and called a shadow; raise if real shadows
                                # still get flagged, lower if dim objects get missed

# ByteTrack Settings
tracking:
  track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.3
  min_box_area: 100

# Position Estimation Settings
position:
  heading_smoothing_alpha: 1.0 # 1.0 = disabled (raw heading). DO NOT reduce below 1.0.
                               # EMA at 0.4 was tested and caused 20-40° heading lag during turns,
                               # leading to overshoot and 48s runs (vs 25s without smoothing).
                               # The "noise" during turns is partly real rotation, not just noise.
  heading_max_rate_deg: 0.0    # Max heading change per frame before rejection (0.0=disabled)

# Processing
processing:
  max_fps: 15 # cap on frames processed per second. Cuts CPU use, and keeps the
              # controller's frame-counted settings (burst/wait) behaving as tuned
              # at ~12 fps. Uncapped, the loop would run at the camera's 30 fps.

# Controller Settings (Arduino Serial Communication)
controller:
  enabled: true # Set to true to enable robot control
  serial:
    port: "auto" # "auto" for auto-detect, or specify "COM3", "/dev/ttyUSB0", "/dev/cu.usbserial-XXX"
    baudrate: 9600
  command_interval: 0.05 # seconds between commands (50ms)
  heartbeat_timeout: 0.5 # seconds without a write before the active command (or STOP) is re-sent as a heartbeat

# Robot Definitions
# Each robot is identified by its AprilTag ID (tag_id)
# Run the program to see detected tag IDs, then configure here
robots:
  - tag_id: 1 # AprilTag ID for robot identification
    name: "robot_0"
    diameter: 0.30 # meters foot-to-foot (for obstacle avoidance)
    heading_offset_degrees: 180 # Vorpal walks opposite to its tag's up direction (measured); adjust if arrow doesn't point forward (try 90, -90, 180)
    center_offset_x: 0.0 # meters forward from tag center to robot center (for parallax correction)
    center_offset_y: 0.0 # meters left from tag center to robot center (for parallax correction)

  # Add more robots by their tag IDs:
  # - tag_id: 5
  #   name: "robot_5"
  #   diameter: 0.35

# Obstacle Configuration
obstacles:
  file: "config/obstacles.yaml"

# Path Execution Settings (A* waypoints + bearing-based steering)
#
# These values were empirically tuned with AprilTag-based heading detection.
# AprilTag heading noise characteristics (measured):
#   - Stationary: 0-3° noise
#   - Forward driving: 5-15° noise
#   - During rotation: 20-70° transient spikes (corner detection confusion)
#
# WARNING: Do not increase spin_threshold or burst_frames without testing.
# Previous values (spin=10°, burst=3, wait=3) caused false spin detection
# and overshoot respectively. Do not add heading EMA smoothing (alpha<1.0) —
# it was tested at 0.4 and caused 20-40° heading lag during turns, making
# navigation significantly slower (48s vs 25s for ~1m paths).
path_execution:
  waypoint_threshold: 0.1  # meters - distance to waypoint before advancing
  spin_threshold_deg: 20.0 # heading delta (°/frame) above which robot brakes.
                           # 10° triggered false positives from normal detection noise.
                           # 20° catches genuine uncontrolled spinning without false triggers.
  burst_frames: 2          # frames of continuous turning per burst.
                           # 3 caused overshoot; 2 gives tighter turn control with less lag.
  max_wait_frames: 2       # frames to drive forward after burst while heading catches up.
                           # Robot moves forward (not stop) during these frames when angle < 90°,
                           # like a human alternating turn taps with forward motion.
  forward_threshold_deg: 20.0 # Hysteresis ENTRY threshold: robot must be within this angle
                              # of the waypoint bearing to START driving forward.
                              # EXIT threshold is automatically +10° (= 30°): robot must
                              # drift this far off before switching back to turning.
                              # This 10° dead zone prevents oscillation from 5-15° heading noise.
                              # Without hysteresis, a single 30° threshold caused 40s of
                              # forward/turn oscillation; 45° let the robot drive forward
                              # when 38-43° off target. Hysteresis eliminates both problems.
                              #
                              # Continuous turning kicks in at 1.5× exit threshold (= 45°).
                              # Below 45°: burst/wait for precision. Above 45°: continuous
                              # turn commands every frame (no stopping) for faster rotation.
  tracking_lost_timeout_s: 3.0 # seconds to keep driving after AprilTag detection is lost.
                               # During normal driving, the AprilTag is frequently not detected
                               # for 1-1.5 seconds due to motion blur, camera angle, and the
                               # ~5fps effective frame rate from IP camera + detection latency.
                               # Without this timeout, the robot stops every time detection is
                               # lost (up to 15 stops per maneuver). The robot coasts on its
                               # last steering command during these gaps, and course corrections
                               # resume immediately when detection returns. If tracking is truly
                               # lost (tag covered/removed), the robot stops after this timeout.
                               # Increase if the robot still pauses during normal driving.
                               # Decrease if the robot drives too far when tracking fails.
